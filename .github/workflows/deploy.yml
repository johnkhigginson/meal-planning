name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --delete removes server files that are no longer in the repo. Excluded
      # paths are never deleted, so env files, node_modules, and the live and
      # staging builds stay in place.
      - name: Deploy source to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: mylemonkitchen.com
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./"
          TARGET: /var/www/mylemonkitchen.com
          EXCLUDE: "node_modules/, .git/, .env, .env.*, .next/, .next-build/, .next-old/"

      # The build goes to .next-build while the live site keeps serving .next.
      # If any step fails, the script exits non-zero, the job fails, and .next
      # is untouched. On success the folders are swapped and the service
      # restarts.
      #
      # appleboy/ssh-action@v1 has no script_stop input, so the script must
      # fail fast on its own. The action hands the script to the remote user's
      # login shell, which may not be bash, so the body runs in an explicit
      # bash with -euo pipefail. The quoted 'SCRIPT' delimiter stops the outer
      # shell from expanding anything; bash does all expansion.
      #
      # Renaming .next-build to .next is safe on Next 16.2. The build bakes
      # distDir ".next-build" into its route modules, but on each request
      # `next start` replaces it with the distDir from next.config.ts (".next"
      # when NEXT_DIST_DIR is unset). Tested by building with
      # NEXT_DIST_DIR=.next-build, renaming the output to .next, and serving it.
      # Recheck this after a Next major upgrade, or if a custom cacheHandler or
      # output: "standalone" is added.
      - name: Build and restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: mylemonkitchen.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash -euo pipefail <<'SCRIPT'
            set -euo pipefail

            # nvm is optional. An `if` keeps a missing nvm from tripping set -e,
            # and nvm.sh reads unset variables, so set -u is paused while it loads.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              set +u
              . "$NVM_DIR/nvm.sh"
              set -u
            fi

            cd /var/www/mylemonkitchen.com

            npm ci
            npx prisma generate
            npx prisma migrate deploy

            rm -rf .next-build
            NEXT_DIST_DIR=.next-build npm run build

            rm -rf .next-old
            if [ -d .next ]; then mv .next .next-old; fi
            mv .next-build .next
            sudo systemctl restart meal-planning
            rm -rf .next-old
            SCRIPT

name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy source to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: mylemonkitchen.com
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: "./"
          TARGET: /var/www/mylemonkitchen.com
          EXCLUDE: "node_modules/, .git/, .env"

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: mylemonkitchen.com
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /var/www/mylemonkitchen.com

            npm ci
            npx prisma generate
            npm run build

            if pm2 describe meal-planning > /dev/null 2>&1; then
              pm2 restart meal-planning
            else
              PORT=3003 pm2 start npm --name meal-planning -- start
            fi

            pm2 save

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ee" />
    <meta name="robots" content="noindex" />
    <title>You're offline | My Lemon Kitchen</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #fbf7ee;
        color: #1f1b14;
        font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      h1 { margin: 20px 0 8px; font-family: Fraunces, Georgia, serif; font-size: 2rem; font-weight: 600; }
      p { margin: 0 0 24px; color: #6b6355; line-height: 1.6; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #f4cf3a;
        color: #1f1b14;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #7a5c00; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>My Lemon Kitchen needs a connection to load this page. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
